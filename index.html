<!doctype html>
<html lang="ja">
<head>
<title>資産管理簿</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="資産管理簿">
<meta name="theme-color" content="#EDF1EF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#14201C; --muted:#5B6964; --faint:#8C9994; --line:#DCE3DF;
  --accent:#0A7560; --accent-ink:#FFFFFF; --accent-soft:#DCEFE9;
  --neg:#C0402B; --neg-soft:#F8E3DF; --pos:#0A7560; --carry:#B06F12;
  --c-bank:#2E6DAD; --c-cash:#5E9E5B; --c-sec:#CF8628; --c-pension:#8660B5; --c-ins:#2F9D9A;
  --c-estate:#9C6146; --c-point:#CF5294; --c-other:#7A8883; --c-debt:#C0402B;
  --shadow:0 1px 2px rgba(20,32,28,.05),0 6px 20px rgba(20,32,28,.06);
  --font:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --num:"Outfit",-apple-system,"Hiragino Sans",sans-serif;
  --tabh:62px;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1513; --surface:#17201D; --surface-2:#1D2824; --ink:#E6EEEA; --muted:#9DABA5; --faint:#6D7B76; --line:#2A3632;
    --accent:#3FBF9C; --accent-ink:#06231B; --accent-soft:#16352D; --neg:#EF7A63; --neg-soft:#3A1F1A; --pos:#3FBF9C; --carry:#E6A54E;
    --c-bank:#5C9BDB; --c-cash:#86C482; --c-sec:#E6A54E; --c-pension:#AA8AD6; --c-ins:#55C2BE;
    --c-estate:#C98B6E; --c-point:#E57BB4; --c-other:#9AA8A3; --c-debt:#EF7A63; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1513; --surface:#17201D; --surface-2:#1D2824; --ink:#E6EEEA; --muted:#9DABA5; --faint:#6D7B76; --line:#2A3632;
  --accent:#3FBF9C; --accent-ink:#06231B; --accent-soft:#16352D; --neg:#EF7A63; --neg-soft:#3A1F1A; --pos:#3FBF9C; --carry:#E6A54E;
  --c-bank:#5C9BDB; --c-cash:#86C482; --c-sec:#E6A54E; --c-pension:#AA8AD6; --c-ins:#55C2BE;
  --c-estate:#C98B6E; --c-point:#E57BB4; --c-other:#9AA8A3; --c-debt:#EF7A63; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.08em}
.top .sub{font-size:12px;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.sec-h .aside{font-size:12px;color:var(--faint)}

.hero{padding-block:4px 2px}
.hero .lbl{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.hero .big{font-family:var(--num);font-weight:600;font-size:clamp(34px,10vw,44px);line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 6px;overflow-wrap:anywhere}
.hero .split{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.hero .split b{font-weight:500;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;margin-top:10px;font-weight:500}
.pill.up{background:var(--accent-soft);color:var(--pos)}
.pill.down{background:var(--neg-soft);color:var(--neg)}
.pill.flat{background:var(--surface-2);color:var(--muted)}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--neg-soft)}

.breakdown{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
@media (max-width:360px){.breakdown{grid-template-columns:1fr}.breakdown svg{max-width:160px;margin:0 auto}}
.donut{width:100%;height:auto;display:block}
.donut .c1{font-size:10px;fill:var(--muted)}
.donut .c2{font-size:15px;font-weight:600;fill:var(--ink);font-family:var(--num)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.legend li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .v{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.legend .v em{font-style:normal;color:var(--faint);font-size:11px;margin-left:6px;display:inline-block;min-width:2.8em}
.legend li.debt{border-top:1px dashed var(--line);padding-top:5px;margin-top:2px}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis0{stroke:var(--faint);stroke-width:1}
.chart .tick{font-size:9.5px;fill:var(--faint);font-family:var(--num)}
.chart .netline{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.chart .netdot{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.chart .netend{fill:var(--ink)}
.chart-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:8px}
.chart-key span{display:inline-flex;align-items:center;gap:5px}
.chart-key i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-key i.line{height:2px;width:14px;background:var(--ink);border-radius:0}

.group{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.group-h .cat{display:inline-flex;align-items:center;gap:8px}
.group-h .sw{width:10px;height:10px;border-radius:3px}
.group-h .sum{font-family:var(--num);font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:active{background:var(--surface-2)}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--faint)}
.item .amt{font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt.neg{color:var(--neg)}
.item .diff{display:block;text-align:right;font-size:12px}
.item .diff.up{color:var(--pos)} .item .diff.down{color:var(--neg)} .item .diff.flat{color:var(--faint)}
.item.current{background:var(--accent-soft)}
.chev{color:var(--faint);margin-left:4px}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:var(--neg);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--neg);border:1.5px solid var(--neg)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 140px}

.datebar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.datebar input{font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;min-height:46px;font-family:var(--num)}
.datebar .btn{min-height:46px}
.status{font-size:12.5px;color:var(--muted);margin:0}
.status b{color:var(--ink);font-weight:500}
.rec-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rec-total .v{font-family:var(--num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.rec-row{display:grid;grid-template-columns:1fr minmax(120px,46%);gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.rec-row .name{font-weight:500;overflow-wrap:anywhere;line-height:1.4}
.rec-row .meta{font-size:11.5px;color:var(--faint)}
.rec-row .meta.carried{color:var(--carry)}
.amt-wrap{position:relative}
.amt-wrap::before{content:"¥";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px;pointer-events:none}
.amt-in{width:100%;font-family:var(--num);font-size:16px;font-variant-numeric:tabular-nums;text-align:right;padding:9px 10px 9px 22px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2)}
.amt-in:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.amt-in::placeholder{color:var(--faint)}
.rec-row.explicit .amt-in{border-color:var(--accent-soft);background:var(--surface)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);width:100%}
.field textarea{min-height:96px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.hint{font-size:12px;color:var(--faint);margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.set-h{font-size:15px;font-weight:700;margin:0 0 4px}
.p{margin:0;font-size:13px;color:var(--muted)}

.empty{text-align:center;padding:36px 16px}
.empty h2{margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 16px;color:var(--muted);font-size:14px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--faint);font-weight:500}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,18,15,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:17px}
.spark{width:100%;height:auto;display:block}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2}
.spark path.a{fill:var(--accent-soft)}
.spark text{font-size:10px;fill:var(--faint);font-family:var(--num)}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>資産管理簿</h1>
    <span class="sub" id="today"></span>
  </header>
  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-accounts" hidden></section>
    <section class="view" id="view-record" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="メニュー">
  <div class="in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>ホーム</button>
    <button data-tab="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>口座</button>
    <button data-tab="record"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/></svg>記録</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
const KEY='shisan-kanribo-v2', OLD_KEY='wagaya-shisan-v1';
const CATS=[
  {id:'bank',name:'預金'},
  {id:'cash',name:'現金'},
  {id:'sec',name:'株式・投資信託'},
  {id:'pension',name:'年金（iDeCo等）'},
  {id:'ins',name:'保険'},
  {id:'estate',name:'不動産・車'},
  {id:'point',name:'ポイント・電子マネー'},
  {id:'other',name:'その他の資産'},
  {id:'debt',name:'負債・ローン',liab:true},
];
const catById=Object.fromEntries(CATS.map(c=>[c.id,c]));
const col=id=>`var(--c-${id})`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- dates (YYYY-MM-DD) ---------- */
const p2=n=>String(n).padStart(2,'0');
const ymdOf=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymdOf(d)};
const dLabel=s=>{const [y,m,d]=s.split('-');return `${y}年${+m}月${+d}日`};
const dShort=s=>{const [,m,d]=s.split('-');return `${+m}/${+d}`};
const TODAY=ymdOf(new Date());
const isYmd=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);

/* ---------- format ---------- */
const yen=n=>(n<0?'−':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const signedYen=n=>(n>0?'+':n<0?'−':'±')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
function man(n){const a=Math.abs(n);const s=n<0?'−':'';
  if(a>=1e8)return s+(a/1e8).toLocaleString('ja-JP',{maximumFractionDigits:2})+'億円';
  if(a>=1e4)return s+(a/1e4).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万円';
  return s+Math.round(a).toLocaleString('ja-JP')+'円'}
function axisLbl(v){const a=Math.abs(v),s=v<0?'−':'';
  if(a===0)return '0';
  if(a>=1e8)return s+(a/1e8).toLocaleString('ja-JP',{maximumFractionDigits:1})+'億';
  if(a>=1e4)return s+(a/1e4).toLocaleString('ja-JP',{maximumFractionDigits:0})+'万';
  return s+a.toLocaleString('ja-JP')}
const parseAmt=s=>{const t=String(s).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[,，\s¥￥円]/g,'').replace(/[－ー−]/g,'-');if(t===''||t==='-')return null;const n=Number(t);return Number.isFinite(n)?Math.round(n):null};

/* ---------- storage ---------- */
let S, dates=[];
const blank=()=>({v:2,accounts:[],records:{},sample:false,lastBackup:null});
function normalize(d){
  const out={...blank(),sample:!!d.sample,lastBackup:d.lastBackup||null,
    accounts:(Array.isArray(d.accounts)?d.accounts:[]).filter(a=>a&&a.id&&catById[a.cat]).map(a=>({id:String(a.id),name:String(a.name||''),cat:a.cat,memo:String(a.memo||'')})),
    records:{}};
  const src=(d.records&&typeof d.records==='object')?d.records:{};
  for(const k of Object.keys(src)){
    let key=k;
    if(/^\d{4}-\d{2}$/.test(k)){ // 旧形式（月ごと）は月末日の記録に変換
      const [y,m]=k.split('-').map(Number);key=ymdOf(new Date(y,m,0));if(key>TODAY)key=TODAY}
    if(!isYmd(key)||!src[k]||typeof src[k]!=='object')continue;
    out.records[key]={...(out.records[key]||{}),...src[k]}}
  return out}
function load(){for(const k of [KEY,OLD_KEY]){try{const r=localStorage.getItem(k);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.accounts))return normalize(d)}}catch(e){}}return null}
function reindex(){for(const k of Object.keys(S.records)){if(!S.records[k]||!Object.keys(S.records[k]).length)delete S.records[k]}dates=Object.keys(S.records).sort()}
function save(){reindex();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('この端末に保存できませんでした。プライベートブラウズをオフにしてください')}}

/* ---------- calc ---------- */
// 記録がない口座は、その日以前で一番新しい記録の値を引き継ぐ
function valueAt(id,day,strict){for(let i=dates.length-1;i>=0;i--){const d=dates[i];if(strict?d>=day:d>day)continue;const r=S.records[d];if(id in r)return {v:r[id],from:d}}return {v:0,from:null}}
function totals(day,strict){const t={assets:0,liab:0,byCat:{}};
  for(const a of S.accounts){const v=valueAt(a.id,day,strict).v;
    if(catById[a.cat].liab)t.liab+=v;else t.assets+=v;
    t.byCat[a.cat]=(t.byCat[a.cat]||0)+v}
  t.net=t.assets-t.liab;return t}

/* ---------- sample ---------- */

    ['手元の現金','cash',60000,0,20000,''],

    ['自動車ローン','debt',1900000,-42000,0,'2029年完済予定'],
  ].map(([name,cat,base,step,noise,memo])=>{const a={id:uid(),name,cat,memo};d.accounts.push(a);return {a,base,step,noise}});
  const gaps=[0,5,31,38,24,33,29,41,27,30,36,22]; // 記録日の間隔はばらばら
  let day=TODAY;const days=[];for(let i=0;i<gaps.length;i++){day=addDays(day,-gaps[i]);days.unshift(day)}
  days.forEach((dy,k)=>{const r={};
    list.forEach(({a,base,step,noise},j)=>{if(k%3===1&&j%2===1)return; // 一部の口座は記録を省略（引き継ぎの例）
      r[a.id]=Math.max(0,Math.round((base+step*k+Math.sin(k*1.7+j*2.1)*noise)/1000)*1000)});
    d.records[dy]=r});
  return d}

function niceTicks(min,max){const span=(max-min)||1;const raw=span/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
  const out=[];for(let v=lo;v<=hi+step/2;v+=step)out.push(Math.round(v));return out}

function trendSVG(ds){
  const W=340,H=210,L=40,R=10,T=10,B=24;
  const data=ds.map(d=>totals(d));
  const max=Math.max(1,...data.map(d=>d.assets)),min=Math.min(0,...data.map(d=>-d.liab),...data.map(d=>d.net));
  const ticks=niceTicks(min,max),lo=ticks[0],hi=ticks[ticks.length-1];
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const bw=(W-L-R)/ds.length,barW=Math.min(20,bw*.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="記録ごとの資産と負債の推移">`;
  ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'axis0':'grid'}"/><text x="${L-6}" y="${y(v)+3.5}" class="tick" text-anchor="end">${axisLbl(v)}</text>`});
  const pts=[];
  data.forEach((d,i)=>{const cx=L+bw*(i+.5);let acc=0;
    for(const c of CATS){if(c.liab)continue;const v=d.byCat[c.id]||0;if(v<=0)continue;
      s+=`<rect x="${cx-barW/2}" y="${y(acc+v)}" width="${barW}" height="${Math.max(0,y(acc)-y(acc+v))}" style="fill:${col(c.id)}"/>`;acc+=v}
    if(d.liab>0)s+=`<rect x="${cx-barW/2}" y="${y(0)}" width="${barW}" height="${y(-d.liab)-y(0)}" style="fill:var(--c-debt);opacity:.55"/>`;
    if(ds.length<=7||i%2===(ds.length-1)%2)s+=`<text x="${cx}" y="${H-7}" class="tick" text-anchor="middle">${dShort(ds[i])}</text>`;
    pts.push([cx,y(d.net)])});
  if(pts.length>1)s+=`<path class="netline" d="M${pts.map(p=>p.join(',')).join('L')}"/>`;
  pts.forEach((p,i)=>{s+=i===pts.length-1?`<circle class="netend" cx="${p[0]}" cy="${p[1]}" r="4"/>`:`<circle class="netdot" cx="${p[0]}" cy="${p[1]}" r="2.4"/>`});
  return s+'</svg>'}

function donutSVG(t){const R=54,C=2*Math.PI*R;let off=0;
  const items=CATS.filter(c=>!c.liab).map(c=>({c,v:t.byCat[c.id]||0})).filter(x=>x.v>0);const sum=items.reduce((a,x)=>a+x.v,0);
  let s=`<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="資産の内訳"><circle cx="70" cy="70" r="${R}" style="fill:none;stroke:var(--surface-2)" stroke-width="18"/>`;
  items.forEach(x=>{const len=x.v/sum*C;
    s+=`<circle cx="70" cy="70" r="${R}" style="fill:none;stroke:${col(x.c.id)}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
  s+=`<text x="70" y="64" text-anchor="middle" class="c1">総資産</text><text x="70" y="84" text-anchor="middle" class="c2">${esc(man(sum).replace('円',''))}</text></svg>`;
  return s}

  h+=`</div>`;
  h+=`<div class="card"><div class="sec-h"><h2>資産の内訳</h2>${last?`<span class="aside">${dLabel(last)}時点</span>`:''}</div>`;
  if(t.assets>0){const aItems=CATS.filter(c=>!c.liab&&(t.byCat[c.id]||0)>0);
    h+=`<div class="breakdown">${donutSVG(t)}<ul class="legend">`+
    aItems.map(c=>`<li><span class="sw" style="background:${col(c.id)}"></span><span>${c.name}</span><span class="v">${man(t.byCat[c.id])}<em>${(t.byCat[c.id]/t.assets*100).toFixed(0)}%</em></span></li>`).join('')+
    (t.liab>0?`<li class="debt"><span class="sw" style="background:var(--c-debt)"></span><span>負債・ローン</span><span class="v" style="color:var(--neg)">−${man(t.liab)}<em></em></span></li>`:'')+
    `</ul></div>`}else h+=`<p class="p">残高を記録すると内訳が表示されます。</p>`;
  h+=`</div>`;
  if(dates.length){const ds=dates.slice(-12);const usedCats=CATS.filter(c=>S.accounts.some(a=>a.cat===c.id));
    h+=`<div class="card"><div class="sec-h"><h2>推移</h2><span class="aside">直近${ds.length}回の記録</span></div>${trendSVG(ds)}
      <div class="chart-key"><span><i class="line"></i>純資産</span>${usedCats.map(c=>`<span><i style="background:${col(c.id)}${c.liab?';opacity:.55':''}"></i>${c.name}</span>`).join('')}</div></div>`}

      ${spark}
      <div class="btn-row"><button type="button" class="btn ghost" data-act="close-sheet-btn">キャンセル</button><button type="submit" class="btn">${isNew?'追加する':'保存する'}</button></div>
      ${isNew?'':`<button type="button" class="btn danger-ghost block" data-act="del-account">この口座を削除</button>`}
    </form></div></div>`;
  $('#accForm').addEventListener('submit',e=>{e.preventDefault();
    const name=$('#f-name').value.trim();if(!name){$('#f-name').focus();return}
    const data={name,cat:$('#f-cat').value,memo:$('#f-memo').value.trim()};
    if(isNew){const a={id:uid(),...data};S.accounts.push(a);const v=parseAmt($('#f-amt').value);if(v!==null){S.records[TODAY]=S.records[TODAY]||{};S.records[TODAY][a.id]=v}}
    else Object.assign(S.accounts.find(a=>a.id===acc.id),data);
    S.sample=false;save();closeSheet();render();toast(isNew?'口座を追加しました':'保存しました')});
  $('#sheetRoot').dataset.id=acc.id||'';
  if(isNew)setTimeout(()=>$('#f-name')&&$('#f-name').focus(),250)}
function closeSheet(){$('#sheetRoot').innerHTML=''}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabbar button');if(tb){go(tb.dataset.tab);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='close-sheet'&&e.target!==el)return;
  switch(act){
    case 'new-account':openSheet(null);break;
    case 'edit-account':openSheet(S.accounts.find(a=>a.id===el.dataset.id));break;
    case 'close-sheet':case 'close-sheet-btn':closeSheet();break;
    case 'del-account':{
      if(!sheetDel){sheetDel=true;el.textContent='もう一度押すと削除（記録も消えます）';el.className='btn danger block';return}
      const id=$('#sheetRoot').dataset.id;S.accounts=S.accounts.filter(a=>a.id!==id);for(const d in S.records)delete S.records[d][id];
      save();closeSheet();render();toast('削除しました');break}
    case 'goto-record':recDate=TODAY;go('record');break;
    case 'goto-settings':go('settings');break;
    case 'rec-today':recDate=TODAY;confirmState=null;renderRecord();break;
    case 'open-record':recDate=el.dataset.d;confirmState=null;renderRecord();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'fill-carried':{S.records[recDate]=S.records[recDate]||{};let n=0;
      for(const a of S.accounts){if(!(a.id in S.records[recDate])){const c=valueAt(a.id,recDate,true);if(c.from){S.records[recDate][a.id]=c.v;n++}}}
      S.sample=false;save();renderRecord();toast(n?`${n}件を前回と同じ値で確定しました`:'空欄の口座はありません');break}
    case 'del-record':confirmState={kind:'del-record'};renderRecord();break;
    case 'del-record-yes':delete S.records[recDate];confirmState=null;save();renderRecord();toast('記録を削除しました');break;
    case 'load-sample':
      if(S.accounts.length&&!S.sample){if(tab!=='settings')go('settings');confirmState={kind:'sample'};renderSettings();break}
      S=sampleData();save();go('home');break;
    case 'sample-yes':S=sampleData();save();go('home');toast('サンプルを読み込みました');break;
    case 'clear-sample':S=blank();save();render();toast('サンプルを消しました。口座を追加して始めましょう');break;
    case 'export-file':exportFile();break;
    case 'export-copy':exportCopy();break;
    case 'restore-text':{const v=$('#restoreText').value.trim();if(!v){toast('バックアップのテキストを貼り付けてください');return}prepRestore(v);break}
    case 'restore-yes':S=confirmState.data;save();go('home');toast('復元しました');break;
    case 'wipe':confirmState={kind:'wipe'};renderSettings();break;
    case 'wipe-yes':S=blank();save();go('home');toast('すべて削除しました');break;
    case 'confirm-no':confirmState=null;render();break;
  }
});
document.addEventListener('input',e=>{if(e.target.classList.contains('amt-in'))onAmtInput(e.target)});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('amt-in')){const v=parseAmt(t.value);t.value=v===null?'':v.toLocaleString('ja-JP')}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('amt-in')){t.value=t.value.replace(/,/g,'')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetRoot').innerHTML)closeSheet()});

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- boot ---------- */
S=load();
if(!S){S=sampleData()}
save();
$('#today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
go('home');
})();
</script>
</body>
</html>
